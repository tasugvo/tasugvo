name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tasugvo
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          output_action: commit
          committer_branch: main
          filename: languages.svg
